name: Daily A-Stock Valuation Analysis

on:
  schedule:
    # 每天早上9:30运行（北京时间，UTC+8）
    - cron: '30 1 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run analysis
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          mkdir -p reports
          node src/main.js
      
      - name: Commit and push report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/
          git commit -m "Add daily valuation report $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push || true
