name: Test Feishu Push

on:
  # 手动触发
  workflow_dispatch:

jobs:
  test-push:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Test Feishu push
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          # 直接使用curl发送测试消息
          now=$(date +"%Y-%m-%d %H:%M:%S")
          message="【测试消息】\n\n当前时间: $now\n\n这是一条测试消息，用于验证飞书推送功能是否正常。"
          payload=$(echo "{\"msg_type\": \"text\", \"content\": {\"text\": \"$message\"}}" | sed 's/\\n/\\\\n/g')
          curl -X POST -H "Content-Type: application/json" -d "$payload" "$FEISHU_WEBHOOK"
          echo "测试消息发送完成！"
      
      - name: Sleep for 60 seconds
        run: sleep 60
